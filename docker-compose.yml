services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - "5435:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  pgdata: