{% extends "base.html" %}

{% block content %}
    <h1 class="h3 mb-3">Sign up</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign up</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
