{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}
