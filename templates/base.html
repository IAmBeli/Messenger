<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messenger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<nav class="navbar border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'chat_list' %}">Messenger</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2">
                {% csrf_token %}
                <span>{{ user }}</span>
                <button type="submit" class="btn btn-sm btn-outline-secondary">Log out</button>
            </form>
        {% endif %}
    </div>
</nav>
<body>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
