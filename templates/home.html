{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
{% if user.is_authenticated %}
    <p>Hello, {{ user }}</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary">Log out</button>
    </form>
{% else %}
    <a href="{% url 'login' %}" class="btn btn-primary">Log in</a>
{% endif %}
{% endblock %}
