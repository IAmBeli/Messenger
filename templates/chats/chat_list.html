{% extends "base.html" %}
{% load chat_tags %}

{% block title %}Chats{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Chats</h1>
    <div class="d-flex gap-2 mb-3">
        <a href="{% url 'start_chat' %}" class="btn btn-primary">New chat</a>
        <a href="{% url 'create_group' %}" class="btn btn-primary">New group</a>
    </div>
    <div class="list-group">
        {% for chat in chats %}
            <a href="{% url 'chat_detail' chat.pk %}" class="list-group-item list-group-item-action">
                {{ chat|title_for:user }}
            </a>
        {% empty %}
            <p class="text-body-secondary">No chats yet.</p>
        {% endfor %}
    </div>
{% endblock %}
