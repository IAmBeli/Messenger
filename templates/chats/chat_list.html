{% extends "base.html" %}
{% load chat_tags %}

{% block title %}Chats{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Chats</h1>
    <div class="list-group">
        {% for chat in chats %}
            <a href="{% url 'chat_detail' chat.pk %}" class="list-group-item list-group-item-action">
                {{ chat|title_for:user }}
            </a>
        {% empty %}
            <p class="text-body-secondary">No chats yet.</p>
        {% endfor %}
    </div>
{% endblock %}
