{% extends "base.html" %}
{% load chat_tags %}

{% block title %}Chats{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Chats</h1>
    <div class="list-group">
        {% for chat in chats %}
            <div class="list-group-item">{{ chat|title_for:user }}</div>
        {% empty %}
            <p class="text-body-secondary">No chats yet.</p>
        {% endfor %}
    </div>
{% endblock %}
